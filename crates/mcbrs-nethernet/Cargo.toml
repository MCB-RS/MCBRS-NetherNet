[package]
name = "mcbrs-nethernet"
description = "NetherNet (WebRTC + HTTP signaling) transport layer for MCBRS Minecraft Bedrock servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Async runtime & HTTP signaling
tokio = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
async-trait = "0.1"

# WebRTC (DTLS + SCTP data channels)
webrtc = "0.21"
rtc = { version = "0.21", default-features = false }
bytes = "1"

# Identity assertions (JWT / detached JWS, ES256 + ES384)
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "jwk", "pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false }
anyhow = "1"
